name: Mirror Release

# 从上游 MetaCubeX/mihomo 抓 amd64-v3 的两个包,改名后转发到本仓库 Release。
# 不编译、不写发布说明(正文留空)。
#   deb:  mcore-*   只改外层文件名,包内仍是 mihomo(含 /usr/bin/mihomo 与 systemd 单元)。
#   zip:  micore-*  外层文件名与包内 exe 都改;exe 字节不变,zip 因重打包与上游字节不同。

on:
  schedule:
    # 每 6 小时一次,避开整点
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定版本(如 v1.19.33),留空则取上游 latest"
        required: false
        default: ""
      force:
        description: "已有同名资产也重新上传"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SOURCE_REPO: MetaCubeX/mihomo
  # 上游文件名前缀 mihomo-,本仓库发布时换掉。
  # deb 用 mcore-,windows zip 的外层文件名与包内 exe 都用 micore-(多一个 i)。
  FILE_PREFIX: mcore
  WIN_PREFIX: micore
  TITLE_PREFIX: mcore

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 解析上游版本
        id: up
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${SOURCE_REPO}/releases/latest" --jq '.tag_name')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::取不到上游版本号"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游版本: $TAG"

      - name: 检查是否已同步
        id: chk
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          SKIP=false
          if [ "${{ inputs.force }}" != "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            HAVE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
            SKIP=true
            # 资产必须正好是改名后的两个,且正文为空
            COUNT=$(printf '%s\n' "$HAVE" | grep -c . || true)
            [ "$COUNT" -eq 2 ] || SKIP=false
            for f in "${FILE_PREFIX}-linux-amd64-v3-${TAG}.deb" "${WIN_PREFIX}-windows-amd64-v3-${TAG}.zip"; do
              printf '%s\n' "$HAVE" | grep -qx "$f" || SKIP=false
            done
            [ -z "$BODY" ] || SKIP=false
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "已是 deb(mcore-*) + zip(micore-*) 两个资产且正文为空,跳过"
          fi

      - name: 下载并改名
        if: steps.chk.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          mkdir -p dist
          # 精确文件名,避免误抓 -go120/-go123 等旧 Go 变体
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir dist \
            --pattern "mihomo-linux-amd64-v3-${TAG}.deb" \
            --pattern "mihomo-windows-amd64-v3-${TAG}.zip"
          cd dist
          # deb 用 mcore-,windows zip 用 micore-
          for f in mihomo-*; do
            case "$f" in
              *.zip) mv -v "$f" "${WIN_PREFIX}-${f#mihomo-}" ;;
              *)     mv -v "$f" "${FILE_PREFIX}-${f#mihomo-}" ;;
            esac
          done
          ls -lh

      - name: 重打包 zip(内部 exe 也改名)
        if: steps.chk.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd dist
          TAG="${{ steps.up.outputs.tag }}"
          ZIP="${WIN_PREFIX}-windows-amd64-v3-${TAG}.zip"
          OUT="$PWD/$ZIP"
          WORK="$RUNNER_TEMP/rezip"
          rm -rf "$WORK" && mkdir -p "$WORK"

          unzip -q "$ZIP" -d "$WORK"

          # 把归档内所有 mihomo-* 一并改名(上游 zip 里就一个 mihomo-windows-amd64-v3.exe)
          n=0
          while IFS= read -r -d '' f; do
            d=$(dirname "$f"); b=$(basename "$f")
            [ "$b" = "${WIN_PREFIX}-${b#mihomo-}" ] && continue
            mv -v "$f" "$d/${WIN_PREFIX}-${b#mihomo-}"
            n=$((n + 1))
          done < <(find "$WORK" -type f -name 'mihomo-*' -print0)
          if [ "$n" -eq 0 ]; then
            echo "::error::zip 内没有 mihomo-* 文件,上游包结构可能变了"
            unzip -l "$OUT"
            exit 1
          fi

          # -X 去掉 uid/gid 等 extra 字段;时间戳沿用归档内记录,同输入必然产出同字节
          rm -f "$OUT"
          ( cd "$WORK" && shopt -s nullglob && set -- * && zip -q -9 -X -r "$OUT" "$@" )

          echo "=== 新 zip 内容 ==="
          unzip -l "$OUT"

          # 自校验:把新 zip 解回来,和重打包前的工作目录逐文件比 sha256。
          # 工作目录只是 mv 改名未动内容,所以相等即证明 exe 与上游字节一致。
          VERIFY="$RUNNER_TEMP/rezip-verify"
          rm -rf "$VERIFY" && mkdir -p "$VERIFY"
          unzip -q "$OUT" -d "$VERIFY"
          if ! diff <(cd "$WORK" && sha256sum * | sort) <(cd "$VERIFY" && sha256sum * | sort); then
            echo "::error::重打包后内容与上游不一致"
            exit 1
          fi
          echo "✓ 重打包校验通过:$(cd "$VERIFY" && sha256sum *)"
          ls -lh "$OUT"

      - name: 同步 Release(deb→mcore-,zip→micore-,正文留空)
        if: steps.chk.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          TITLE="${TITLE_PREFIX} ${TAG}"
          WANT_DEB="${FILE_PREFIX}-linux-amd64-v3-${TAG}.deb"
          WANT_ZIP="${WIN_PREFIX}-windows-amd64-v3-${TAG}.zip"

          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
          if [ -z "$RID" ]; then
            echo "创建 Release $TAG"
            # 用 API 直接建,便于把 body 显式置空(gh release create 的空正文行为不直观)
            RID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                    -f tag_name="$TAG" \
                    -f target_commitish="${{ github.sha }}" \
                    -f name="$TITLE" \
                    -f body="" \
                    --jq '.id')
          else
            echo "Release 已存在(id=$RID),就地更新"
          fi

          # 清掉不该存在的资产:旧命名的 mihomo-*、checksums.txt 等
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" \
            --jq '.[] | "\(.id)\t\(.name)"' > "$RUNNER_TEMP/assets.tsv"
          while IFS=$'\t' read -r aid aname; do
            [ -n "${aid:-}" ] || continue
            case "$aname" in
              "$WANT_DEB"|"$WANT_ZIP") continue ;;
            esac
            echo "删除多余资产: $aname"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" >/dev/null
          done < "$RUNNER_TEMP/assets.tsv"

          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

          # 标题与正文兜底:正文强制为空
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
            -f name="$TITLE" -f body="" >/dev/null

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,body,assets \
            --jq '{name, body, assets: [.assets[] | {name, size}]}'
